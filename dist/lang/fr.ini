sCloseHelpOverlay = Commencer
sHelpOverlayHotkeys = Raccourcis
sHelpOverlayHotkeysBody = Utilisez la touche configurée pour ouvrir ou fermer le menu à tout moment.
sHelpOverlayFilters = Filtres
sHelpOverlayFiltersBody = Les filtres de plugins réduisent l'arborescence de gauche, tandis que les filtres d'enregistrements masquent ou incluent les entrées jouables, sans nom, supprimées et inconnues.
sHelpOverlaySearchBody = La recherche globale parcourt tous les enregistrements chargés. Désactivez-la si vous voulez rester dans le filtre de plugin actif.
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE lit les enregistrements après leur chargement et leur résolution par Fallout 4 à l'exécution. Certaines valeurs peuvent différer des données brutes du plugin dans xEdit.
sHelpOverlayFavorites = Favoris et récents
sHelpOverlayFavoritesBody = Ajoutez des favoris depuis les actions d'enregistrement ou les menus contextuels pour épingler les formulaires importants entre les sessions.
sHelpOverlayRecentBody = Enregistrements récents suit ce que vous inspectez le plus souvent pour y revenir sans relancer une recherche.
sHelpOverlayAdvancedFilters = Filtres avancés
sHelpOverlayAdvancedFiltersBody = Les filtres avancés d'enregistrements permettent de définir des règles par mot-clé pour bloquer ou autoriser certains enregistrements globalement. Accédez-y depuis la barre de filtres ou les Paramètres.
sHelpOverlayAdvancedFiltersExampleBody = Par exemple, vous pouvez masquer tous les enregistrements contenant 'SS2_Tag_' pour éliminer le contenu Sim Settlements de vos résultats.
sHelpOverlayInventory = Onglet Inventaire
sHelpOverlayInventoryBody = L'onglet Inventaire affiche votre inventaire de joueur regroupé par catégorie. Vous pouvez inspecter, déposer ou mettre en favori directement.
sHelpOverlayInventoryComponentBody = Les composants sont automatiquement substitués par leur forme de ferraille utilisable lors du don, pour qu'ils fonctionnent pour la fabrication. Cela peut être basculé dans Paramètres > Gameplay.
sHelpOverlaySafeActions = Actions sûres
sHelpOverlaySafeActionsBody = Consulter les détails, copier les ID et filtrer est sûr. Donner, faire apparaître et se téléporter sont des actions explicites, et les actions importantes demandent une confirmation.
sHelpOverlayMainMenuActionsBody = Les actions de gameplay restent désactivées par défaut dans le menu principal pour des raisons de stabilité. Activez-les seulement si vous comprenez les risques et souhaitez vraiment ce comportement.
sHelpOverlayHistoryBody = Le panneau Historique des actions de la barre d'état affiche les dernières actions de don, d'apparition et de téléportation, avec une annulation en un clic quand l'action peut être inversée.

