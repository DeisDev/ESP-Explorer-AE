sHelpOverlayTitle = Начало работы
sCloseHelpOverlay = Начать
sHelpOverlayHotkeys = Горячие клавиши
sHelpOverlayHotkeysBody = Используйте назначенную клавишу переключения, чтобы в любой момент открыть или закрыть меню.
sHelpOverlayFilters = Фильтры
sHelpOverlayFiltersBody = Фильтры плагинов сужают левое дерево, а фильтры записей скрывают или показывают игровые, безымянные, удалённые и неизвестные записи.
sHelpOverlaySearchBody = Глобальный поиск просматривает все загруженные записи. Отключите его, если хотите оставаться в пределах активного фильтра плагина.
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE читает записи после того, как Fallout 4 загрузил и разрешил их во время выполнения. Некоторые значения могут отличаться от сырых данных плагина в xEdit.
sHelpOverlayFavorites = Избранное и недавнее
sHelpOverlayFavoritesBody = Добавляйте в избранное через действия записи или контекстное меню, чтобы закреплять важные формы между сеансами.
sHelpOverlayRecentBody = Недавние записи отслеживают то, что вы часто просматриваете, чтобы можно было быстро вернуться без нового поиска.
sHelpOverlayAdvancedFilters = Расширенные фильтры
sHelpOverlayAdvancedFiltersBody = Расширенные фильтры записей позволяют задавать правила по ключевым словам для блокировки или разрешения определённых записей глобально. Доступ через панель фильтров или Настройки.
sHelpOverlayAdvancedFiltersExampleBody = Например, можно скрыть все записи, содержащие 'SS2_Tag_', чтобы убрать контент Sim Settlements из результатов.
sHelpOverlayInventory = Вкладка Инвентарь
sHelpOverlayInventoryBody = Вкладка Инвентарь отображает текущий инвентарь игрока, сгруппированный по категориям. Можно просматривать, выбрасывать или добавлять в избранное прямо оттуда.
sHelpOverlayInventoryComponentBody = Компоненты автоматически заменяются на используемый лом при выдаче, чтобы они работали для крафта. Это можно переключить в Настройки > Геймплей.
sHelpOverlaySafeActions = Безопасные действия
sHelpOverlaySafeActionsBody = Просмотр сведений, копирование ID и фильтрация безопасны. Выдача, спавн и телепорт - явные действия, а важные операции требуют подтверждения.
sHelpOverlayMainMenuActionsBody = Игровые действия в главном меню по умолчанию отключены ради стабильности. Включайте их только если понимаете риски и действительно хотите такое поведение.
sHelpOverlayHistoryBody = Панель истории действий в строке состояния показывает недавние действия выдачи, спавна и телепорта, с отменой в один клик там, где действие можно обратить.

