sCloseHelpOverlay = Empezar
sHelpOverlayHotkeys = Atajos
sHelpOverlayHotkeysBody = Usa la tecla configurada para abrir o cerrar el menú en cualquier momento.
sHelpOverlayFilters = Filtros
sHelpOverlayFiltersBody = Los filtros de plugins reducen el árbol izquierdo, mientras que los filtros de registros ocultan o incluyen registros jugables, sin nombre, eliminados y desconocidos.
sHelpOverlaySearchBody = La búsqueda global revisa todos los registros cargados. Desactívala si quieres mantenerte dentro del filtro de plugin activo.
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE lee los registros después de que Fallout 4 los ha cargado y resuelto en tiempo de ejecución. Algunos valores pueden diferir de los datos crudos del plugin en xEdit.
sHelpOverlayFavorites = Favoritos y recientes
sHelpOverlayFavoritesBody = Agrega favoritos desde las acciones del registro o los menús contextuales para fijar formularios importantes entre sesiones.
sHelpOverlayRecentBody = Registros recientes rastrea lo que inspeccionas con más frecuencia para que puedas volver sin buscar otra vez.
sHelpOverlayAdvancedFilters = Filtros avanzados
sHelpOverlayAdvancedFiltersBody = Los filtros avanzados de registros permiten definir reglas basadas en palabras clave para bloquear o permitir registros específicos globalmente. Accédelos desde la barra de filtros o Ajustes.
sHelpOverlayAdvancedFiltersExampleBody = Por ejemplo, puedes ocultar todos los registros que contengan 'SS2_Tag_' para limpiar contenido de Sim Settlements de tus resultados.
sHelpOverlayInventory = Pestaña de Inventario
sHelpOverlayInventoryBody = La pestaña de Inventario muestra tu inventario de jugador agrupado por categoría. Puedes inspeccionar, soltar o marcar como favorito directamente.
sHelpOverlayInventoryComponentBody = Los componentes se sustituyen automáticamente por su forma de chatarra utilizable al darlos, para que funcionen en la fabricación. Esto se puede cambiar en Ajustes > Jugabilidad.
sHelpOverlaySafeActions = Acciones seguras
sHelpOverlaySafeActionsBody = Ver detalles, copiar IDs y filtrar es seguro. Dar, generar y teletransportar son acciones explícitas y las acciones importantes piden confirmación.
sHelpOverlayMainMenuActionsBody = Las acciones de juego permanecen desactivadas en el menú principal por defecto por estabilidad. Actívalas solo si entiendes los riesgos y realmente quieres ese comportamiento.
sHelpOverlayHistoryBody = El panel Historial de acciones de la barra de estado muestra acciones recientes de dar, generar y teletransportar, con deshacer de un clic cuando la acción puede revertirse.

