sCloseHelpOverlay = 시작하기
sHelpOverlayHotkeys = 단축키
sHelpOverlayHotkeysBody = 설정된 토글 키로 언제든지 메뉴를 열거나 닫을 수 있습니다.
sHelpOverlayFilters = 필터
sHelpOverlayFiltersBody = 플러그인 필터는 왼쪽 트리를 좁히고, 레코드 필터는 플레이 가능, 이름 없음, 삭제됨, 알 수 없음 레코드를 숨기거나 표시합니다.
sHelpOverlaySearchBody = 전체 검색은 로드된 모든 레코드를 검색합니다. 현재 플러그인 필터 안에서만 보고 싶다면 끄세요.
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE는 Fallout 4가 런타임에 로드하고 해석한 뒤의 레코드를 읽습니다. 일부 값은 xEdit의 원본 플러그인 데이터와 다를 수 있습니다.
sHelpOverlayFavorites = 즐겨찾기 및 최근 항목
sHelpOverlayFavoritesBody = 레코드 동작이나 컨텍스트 메뉴에서 즐겨찾기를 추가해 중요한 폼을 세션 간에 고정할 수 있습니다.
sHelpOverlayRecentBody = 최근 레코드는 자주 확인한 항목을 추적해 다시 검색하지 않고도 돌아갈 수 있게 합니다.
sHelpOverlayAdvancedFilters = 고급 필터
sHelpOverlayAdvancedFiltersBody = 고급 레코드 필터를 사용하면 키워드 기반 규칙을 정의하여 특정 레코드를 전체적으로 차단하거나 허용할 수 있습니다. 필터 도구 모음이나 설정에서 접근하세요.
sHelpOverlayAdvancedFiltersExampleBody = 예를 들어 'SS2_Tag_'을 포함하는 모든 레코드를 숨겨 Sim Settlements 콘텐츠를 결과에서 제거할 수 있습니다.
sHelpOverlayInventory = 인벤토리 탭
sHelpOverlayInventoryBody = 인벤토리 탭은 카테고리별로 그룹화된 현재 플레이어 인벤토리를 표시합니다. 아이템을 직접 검사, 버리기 또는 즐겨찾기에 추가할 수 있습니다.
sHelpOverlayInventoryComponentBody = 컴포넌트는 지급 시 자동으로 사용 가능한 스크랩 형태로 대체되어 제작에 사용할 수 있습니다. 설정 > 게임플레이에서 전환할 수 있습니다.
sHelpOverlaySafeActions = 안전한 작업
sHelpOverlaySafeActionsBody = 세부 정보 보기, ID 복사, 필터링은 안전합니다. 지급, 스폰, 텔레포트는 명시적 작업이며 중요한 작업은 확인을 요구합니다.
sHelpOverlayMainMenuActionsBody = 안정성을 위해 메인 메뉴에서는 게임플레이 동작이 기본적으로 비활성화됩니다. 위험을 이해하고 그 동작을 정말 원할 때만 활성화하세요.
sHelpOverlayHistoryBody = 상태 표시줄의 작업 기록 패널은 최근 지급, 스폰, 텔레포트 작업을 보여 주며 되돌릴 수 있는 작업은 한 번 클릭으로 취소할 수 있습니다.

