sCloseHelpOverlay = 使い始める
sHelpOverlayHotkeys = ホットキー
sHelpOverlayHotkeysBody = 設定された切替キーでいつでもメニューを開閉できます。
sHelpOverlayFocusSearch = Ctrl+F: 現在の検索欄にフォーカス
sHelpOverlayFilters = フィルター
sHelpOverlayFiltersBody = プラグインフィルターは左側のツリーを絞り込み、レコードフィルターはプレイ可能、名称なし、削除済み、不明のレコードを表示または非表示にします。
sHelpOverlaySearchBody = グローバル検索は読み込まれたすべてのレコードを対象にします。現在のプラグインフィルター内だけを見たい場合はオフにしてください。
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE は Fallout 4 が実行時に読み込み、解決した後のレコードを読み取ります。一部の値は xEdit の生のプラグインデータと異なる場合があります。
sHelpOverlayFavorites = お気に入りと最近
sHelpOverlayFavoritesBody = レコード操作やコンテキストメニューからお気に入りを追加すると、重要なフォームをセッションをまたいで固定できます。
sHelpOverlayRecentBody = 最近のレコードにはよく確認する項目が記録され、再検索せずに戻れます。
sHelpOverlayAdvancedFilters = 高度なフィルター
sHelpOverlayAdvancedFiltersBody = ブラウザーのツールバーから詳細フィルターを開き、名前、EditorID、プラグイン、カテゴリー、キーワードでレコードを非表示にできます。ルールはブラウザー間で共通で、選択したプラグインだけに制限できます。
sHelpOverlayAdvancedFiltersExampleBody = 例えば、'SS2_Tag_' を含むすべてのレコードを非表示にして、Sim Settlementsのコンテンツを結果から除外できます。
sHelpOverlayInventory = インベントリタブ
sHelpOverlayInventoryBody = カテゴリ、装備中、Pip-Boyのお気に入り、レジェンダリー、クエストアイテムで絞り込めます。スタック重量で並べ替えて重いグループを探せます。装備や使用には個体を選択してください。アクションから数量の変更、ドロップ、削除ができます。
sHelpOverlayInventoryComponentBody = コンポーネントは付与時に自動的に使用可能なスクラップ形式に変換され、クラフトに使用できます。設定 > ゲームプレイで切り替え可能です。
sHelpOverlaySafeActions = 安全な操作
sHelpOverlaySafeActionsBody = 詳細の閲覧、IDのコピー、フィルター操作は安全です。付与、スポーン、テレポートは明示的な操作で、重要な操作では確認が表示されます。
sHelpOverlayMainMenuActionsBody = 安定性のため、メインメニューではゲームプレイ操作が既定で無効です。リスクを理解し、その挙動を本当に望む場合にのみ有効にしてください。
sHelpOverlayHistoryBody = アクション履歴には最近のリクエストと確認された結果が表示されます。
