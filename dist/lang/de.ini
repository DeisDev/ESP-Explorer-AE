sHelpOverlayTitle = Erste Schritte
sCloseHelpOverlay = Loslegen
sHelpOverlayHotkeys = Tastenkürzel
sHelpOverlayHotkeysBody = Verwende die konfigurierte Umschalttaste, um das Menü jederzeit zu öffnen oder zu schließen.
sHelpOverlayFilters = Filter
sHelpOverlayFiltersBody = Pluginfilter grenzen den linken Baum ein, während Datensatzfilter spielbare, unbenannte, gelöschte und unbekannte Einträge ausblenden oder einblenden.
sHelpOverlaySearchBody = Die globale Suche durchsucht alle geladenen Einträge. Deaktiviere sie, wenn du im aktiven Pluginfilter bleiben möchtest.
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE liest Einträge, nachdem Fallout 4 sie zur Laufzeit geladen und aufgelöst hat. Manche Werte können von den rohen Plugin-Daten in xEdit abweichen.
sHelpOverlayFavorites = Favoriten und Zuletzt verwendet
sHelpOverlayFavoritesBody = Füge Favoriten über Datensatzaktionen oder Kontextmenüs hinzu, um wichtige Formulare sitzungsübergreifend zu behalten.
sHelpOverlayRecentBody = Zuletzt verwendete Einträge verfolgen, was du zuletzt geprüft hast, damit du ohne erneute Suche zurückspringen kannst.
sHelpOverlayAdvancedFilters = Erweiterte Filter
sHelpOverlayAdvancedFiltersBody = Erweiterte Eintragsfilter erlauben dir stichwortbasierte Regeln zum Blockieren oder Zulassen bestimmter Einträge global festzulegen. Zugriff über die Filterleiste oder Einstellungen.
sHelpOverlayAdvancedFiltersExampleBody = Zum Beispiel kannst du alle Einträge mit 'SS2_Tag_' ausblenden, um Sim-Settlements-Inhalte aus deinen Ergebnissen zu entfernen.
sHelpOverlayInventory = Inventar-Tab
sHelpOverlayInventoryBody = Der Inventar-Tab zeigt dein aktuelles Spielerinventar nach Kategorie gruppiert an. Du kannst Gegenstände direkt dort inspizieren, ablegen oder favorisieren.
sHelpOverlayInventoryComponentBody = Komponenten werden beim Geben automatisch in ihr verwendbares Schrottform umgewandelt, damit sie beim Crafting funktionieren. Dies kann unter Einstellungen > Gameplay umgeschaltet werden.
sHelpOverlaySafeActions = Sichere Aktionen
sHelpOverlaySafeActionsBody = Details ansehen, IDs kopieren und filtern sind sicher. Give-, Spawn- und Teleport-Aktionen sind bewusst getrennt, und wichtige Aktionen fragen zur Bestätigung nach.
sHelpOverlayMainMenuActionsBody = Gameplay-Aktionen bleiben im Hauptmenü aus Stabilitätsgründen standardmäßig deaktiviert. Aktiviere sie nur, wenn du die Risiken kennst und dieses Verhalten bewusst willst.
sHelpOverlayHistoryBody = Das Aktionsverlaufsfeld in der Statusleiste zeigt letzte Give-, Spawn- und Teleport-Aktionen mit Ein-Klick-Rückgängig, wenn die Aktion umkehrbar ist.

