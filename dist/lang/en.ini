sHelpOverlayTitle = Getting Started
sCloseHelpOverlay = Start Exploring
sHelpOverlayHotkeys = Hotkeys
sHelpOverlayHotkeysBody = Use the configured toggle key to open or close the menu at any time.
sHelpOverlayFilters = Filters
sHelpOverlayFiltersBody = Plugin filters narrow the left tree, while record filters hide or include playable, unnamed, deleted, and unknown records.
sHelpOverlaySearchBody = Global Search scans every loaded record. Turn it off when you want to stay inside the active plugin filter.
sHelpOverlayRuntimeRecordsBody = ESP Explorer AE reads records after Fallout 4 has loaded and resolved them at runtime. Some values may differ from raw plugin data in xEdit.
sHelpOverlayFavorites = Favorites And Recent
sHelpOverlayFavoritesBody = Add favorites from record actions or context menus to pin important forms across sessions.
sHelpOverlayRecentBody = Recent Records tracks what you inspect most often, making it easy to jump back without searching again.
sHelpOverlayAdvancedFilters = Advanced Filters
sHelpOverlayAdvancedFiltersBody = Advanced Record Filters let you define keyword-based rules to block or allow specific records globally. Access them from the filter toolbar or Settings.
sHelpOverlayAdvancedFiltersExampleBody = For example, you can hide all records containing 'SS2_Tag_' to declutter Sim Settlements content from your results.
sHelpOverlayInventory = Inventory Tab
sHelpOverlayInventoryBody = The Inventory tab shows your current player inventory grouped by category. You can inspect, drop, or favorite items directly from it.
sHelpOverlayInventoryComponentBody = Components are automatically substituted to their usable scrap form when given, so they work for crafting. This can be toggled in Settings > Gameplay.
sHelpOverlaySafeActions = Safe Actions
sHelpOverlaySafeActionsBody = Viewing details, copying IDs, and filtering are safe. Give, spawn, and teleport actions are explicit and important actions ask for confirmation.
sHelpOverlayMainMenuActionsBody = Gameplay actions stay disabled in the main menu by default for stability. Only enable them if you understand the risks and want that behavior.
sHelpOverlayHistoryBody = The Action History panel in the status bar shows recent give, spawn, and teleport actions, with one-click undo when the action can be reversed.

